name: Frostbridge Multiplayer Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frostbridge-multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Multiplayer unit + integration + runtime preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Node unit and multi-client integration tests
        run: npm test

      - name: Run production preflight
        run: python scripts/preflight.py

      - name: Build deployable multiplayer package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/frostbridge
          cp package.json package-lock.json README.md PRE-FLIGHT.md dist/frostbridge/
          cp -R server public assets dist/frostbridge/
          tar -czf "frostbridge-multiplayer-${GITHUB_SHA::7}.tar.gz" -C dist frostbridge

      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: frostbridge-multiplayer-${{ github.sha }}
          path: frostbridge-multiplayer-*.tar.gz
          if-no-files-found: error
          retention-days: 14
