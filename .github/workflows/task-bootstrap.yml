name: Multiplayer Task Bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Node tests
        run: npm test
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: task-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
