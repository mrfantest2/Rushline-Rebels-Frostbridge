name: Multiplayer Task Bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run Node tests
        run: npm test

      - name: Persist generated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock multiplayer dependencies"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: task-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
