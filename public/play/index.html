<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Frostbridge Player</title><link rel="stylesheet" href="/shared/ui.css"><style>.phone{max-width:620px}.hero-card{text-align:center}.me{width:150px;height:150px;object-fit:contain}.join-fields{display:grid;gap:10px}.outcome{font-size:28px;font-weight:1000;text-align:center;padding:14px}</style></head><body><main class="shell phone"><div class="top"><div class="brand"><div class="mark">RR</div><div><div class="eyebrow">Rushline Rebels</div><b>Frostbridge Player</b></div></div><span class="pill">ROOM&nbsp;<b id="roomBadge">-----</b></span></div><section id="joinCard" class="card"><div class="eyebrow">Join room</div><h1>Choose your Rebel</h1><div class="join-fields"><div class="field"><label>Room code</label><input id="roomInput" maxlength="5" autocomplete="off" placeholder="ABCDE"></div><div class="field"><label>Display name</label><input id="nameInput" maxlength="32" autocomplete="nickname" placeholder="Your name"></div><div id="characters" class="character-grid"></div><button id="joinBtn" class="primary">Join Frostbridge</button><p id="joinError" class="muted"></p></div></section><section id="gameCard" class="stack hidden"><div class="card hero-card"><div class="eyebrow" id="phaseLabel">Lobby</div><img id="meImage" class="me" src="/assets/characters/dana.svg" alt=""><h2 id="meName">Player</h2><div class="row" style="justify-content:center"><span class="pill" id="lives">3 ♥</span><span class="pill" id="stage">Stage 0/10</span><span class="pill" id="connection">Connected</span></div><div id="outcome" class="outcome">Waiting for host</div></div><div class="card"><button id="readyBtn" class="primary" style="width:100%">Ready</button><div id="controls" class="controls" style="margin-top:12px"><button id="leftBtn" class="choice left" disabled>← LEFT</button><button id="rightBtn" class="choice right" disabled>RIGHT →</button></div></div><div class="card"><div class="eyebrow">Final placement</div><div id="placement" class="status">No completed round yet.</div></div></section></main><script src="/socket.io/socket.io.js"></script><script type="module" src="/play/play.js"></script></body></html>
