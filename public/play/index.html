<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Frostbridge Player</title>
  <link rel="stylesheet" href="/shared/ui.css">
</head>
<body>
  <main class="phone-shell">
    <header class="top phone-top">
      <div class="brand"><div class="mark">RR</div><div><div class="eyebrow">Rushline Rebels</div><b>Frostbridge Player</b></div></div>
      <span class="pill">ROOM&nbsp;<b id="roomBadge">-----</b></span>
    </header>

    <section id="joinCard" class="join-panel glass-panel">
      <div class="eyebrow">Join room</div>
      <h1>Choose your Rebel</h1>
      <p class="muted">Enter the room code from the TV, pick a Rebel, then get ready for LEFT or RIGHT.</p>
      <div class="join-fields">
        <div class="field"><label>Room code</label><input id="roomInput" maxlength="5" autocomplete="off" placeholder="ABCDE"></div>
        <div class="field"><label>Display name</label><input id="nameInput" maxlength="32" autocomplete="nickname" placeholder="Your name"></div>
        <div id="characters" class="character-grid"></div>
        <button id="joinBtn" class="primary">Join Frostbridge</button>
        <p id="joinError" class="muted"></p>
      </div>
    </section>

    <section id="gameCard" class="stack hidden">
      <div class="player-identity">
        <div class="eyebrow" id="phaseLabel">Lobby</div>
        <img id="meImage" class="me" src="/assets/characters/dana.svg" alt="">
        <h2 id="meName" class="player-name">Player</h2>
        <div class="player-hud">
          <div class="metric"><span>Lives</span><strong id="lives">3 ♥</strong></div>
          <div class="metric"><span>Progress</span><strong id="stage">Stage 0/10</strong></div>
          <div class="metric"><span>Link</span><strong id="connection">Connected</strong></div>
        </div>
        <div id="outcome" class="outcome">Waiting for host</div>
      </div>

      <div class="choice-panel">
        <div class="ready-row"><button id="readyBtn" class="primary">Ready</button></div>
        <div id="controls" class="controls">
          <button id="leftBtn" class="choice left" disabled>← LEFT</button>
          <button id="rightBtn" class="choice right" disabled>RIGHT →</button>
        </div>
      </div>

      <div class="placement-panel glass-panel">
        <div class="eyebrow">Final placement</div>
        <div id="placement" class="status">No completed round yet.</div>
      </div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/play/play.js"></script>
</body>
</html>
